[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && node dist/server.js"
# Changed from 'npx prisma db push' to 'npx prisma migrate deploy'
# This is safer for production as it uses actual migrations

[[services]]
name = "backend"

[services.variables]
NODE_ENV = "production"
PORT = "${{ PORT }}"
JWT_SECRET = "${{ JWT_SECRET }}"
JWT_EXPIRES_IN = "7d"
FRONTEND_URL = "${{ FRONTEND_URL }}"
DATABASE_URL = "${{ DATABASE_URL }}"
SCRAPER_SERVICE_URL = "${{ SCRAPER_SERVICE_URL }}"
